<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>adventcodendar · tree prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Recursive:wght,CASL,MONO@300..900,0..1,0..1&family=Sono:wght,MONO@300..800,0..1&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/maple-mono/400.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/maple-mono/700.css" rel="stylesheet">
<style>
  /* Her şey karakter ızgarasında. Ağacın en geniş satırı 34 karakter (7 kutu × 4 + 6 boşluk);
     yazı boyu ekrana göre ağacın sığacağı en büyük değer. */
  :root {
    --gutter: 16px;
    --fs: clamp(14px, min(calc((100vw - 2 * var(--gutter)) / 21.6), calc(100svh / 41)), 30px);
    --lh: 1.12;
  }
  [data-yon="gece"] {
    --bg1: #2a1d3d; --bg2: #382851;
    --ink: #f6ecdf; --muted: #a998bf; --wire: #6c5a86;
    --g1: #9fd8b9; --g2: #7cc4a4; --g3: #c6ecd5;
    --a1: #f7a8bd; --a2: #f8dc94; --a3: #c9b6f5;
    --trunk: #d1a582; --star: #ffd98a; --snow: 233, 226, 245;
    --font: "Recursive", ui-monospace, monospace; --fvs: "MONO" 1, "CASL" 1;
  }
  [data-yon="kar"] {
    --bg1: #f7f4fb; --bg2: #e7edf8;
    --ink: #3b2f4a; --muted: #85799a; --wire: #a79cbd;
    --g1: #3f9f7b; --g2: #2f8566; --g3: #5ab892;
    --a1: #de6488; --a2: #cf9a1e; --a3: #8a6fd3;
    --trunk: #a8744f; --star: #e8a72e; --snow: 150, 140, 190;
    --font: "Maple Mono", ui-monospace, monospace; --fvs: normal;
  }
  [data-yon="pembe"] {
    --bg1: #fdeaef; --bg2: #f8d5df;
    --ink: #5a2a3c; --muted: #a46a80; --wire: #c98ea3;
    --g1: #3f9c7a; --g2: #2e8063; --g3: #5ab08e;
    --a1: #e0557c; --a2: #cf9a1e; --a3: #8a6fd3;
    --trunk: #b07a5c; --star: #f2b230; --snow: 205, 120, 150;
    --font: "Sono", ui-monospace, monospace; --fvs: "MONO" 1;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100svh; display: flex; flex-direction: column;
    background: linear-gradient(180deg, var(--bg1), var(--bg2));
    color: var(--ink);
    font-family: var(--font); font-variation-settings: var(--fvs);
    font-size: var(--fs); line-height: var(--lh);
    overflow-x: hidden;
  }
  .ch { display: inline-block; width: 1ch; text-align: center; }

  #kar { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }

  header {
    position: relative; z-index: 3;
    display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: .3em 1ch;
    padding: 14px var(--gutter) 0;
    font-size: max(15px, calc(var(--fs) * .78));
  }
  .ad { font-weight: 700; }
  .yon { color: var(--muted); white-space: nowrap; }
  .yon button {
    font: inherit; font-variation-settings: inherit; color: inherit;
    background: none; border: 0; padding: 0 .5ch; cursor: pointer;
  }
  .yon button[aria-pressed="true"] { background: var(--ink); color: var(--bg1); }

  .isiklar, .zemin { position: relative; z-index: 2; white-space: pre; overflow: hidden; }
  .isiklar { margin-top: .5em; color: var(--wire); }
  .ampul { animation: yan var(--d, 2.4s) ease-in-out var(--g, 0s) infinite; text-shadow: 0 0 .35em currentColor, 0 0 .8em currentColor; }
  @keyframes yan { 0%, 100% { opacity: 1; } 50% { opacity: .2; } }

  main { position: relative; z-index: 1; flex: 1; display: grid; justify-items: center; align-content: center; padding: .6em var(--gutter) 0; }
  .agac { display: grid; justify-items: center; white-space: pre; }
  .yildiz { color: var(--star); text-align: center; }
  .yildiz .isin { animation: yan 3.2s ease-in-out infinite; }
  .yildiz .isin:nth-child(2n) { animation-delay: -1.6s; }
  .yildiz .ch.oz { text-shadow: 0 0 .4em var(--star); font-family: "Apple Symbols", "Segoe UI Symbol", sans-serif; font-size: 1.35em; line-height: .8; }
  .sira { display: flex; gap: 1ch; }
  .sira + .sira { margin-top: -.3em; }

  .kutu {
    display: grid; padding: 0; border: 0; background: none; cursor: pointer;
    font: inherit; font-variation-settings: inherit; line-height: inherit;
    color: var(--c); white-space: pre; position: relative; font-weight: 700;
    transition: transform .15s ease;
  }
  .kutu > span { display: block; }
  .kutu .no { font-weight: 700; }
  .kutu .no b { color: var(--ink); transition: color .3s ease, text-shadow .3s ease; }
  .kutu .kapak i { font-style: normal; display: inline-block; transition: transform .5s cubic-bezier(.3, 1.4, .5, 1), opacity .5s ease; }
  .kutu:hover { transform: translateY(-.12em); }
  .kutu:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .kutu.acik .kapak i { transform: translateY(-.7em); opacity: 0; }
  .kutu.acik .no b { color: var(--star); text-shadow: 0 0 .45em var(--star); }
  .kutu.acik:hover { transform: none; }

  .ipucu { margin: .9em 0 0; color: var(--muted); font-size: max(14px, calc(var(--fs) * .7)); }
  .zemin { color: rgb(var(--snow)); opacity: .85; flex: none; margin-top: .4em; }

  @media (prefers-reduced-motion: reduce) {
    .ampul, .yildiz .isin { animation: none; }
    .kutu, .kutu .kapak i, .kutu .no b { transition: none; }
  }
</style>
</head>
<body data-yon="gece">
<canvas id="kar" aria-hidden="true"></canvas>

<header>
  <div class="ad">adventcodendar</div>
  <div class="yon" role="group" aria-label="prototip yönü">yön <button data-v="gece" aria-pressed="true">gece</button> <button data-v="kar" aria-pressed="false">kar</button> <button data-v="pembe" aria-pressed="false">pembe</button></div>
</header>

<div class="isiklar" id="isiklar" aria-hidden="true"></div>

<main>
  <div class="agac" id="agac"></div>
  <p class="ipucu">tap a box to open it</p>
</main>

<div class="zemin" id="zemin" aria-hidden="true"></div>

<script>
(() => {
  const body = document.body;
  const azHareket = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Yıldız: ortada tek karakter, çevresinde yavaşça yanıp sönen ışınlar.
  const agac = document.getElementById('agac');
  agac.innerHTML = `<div class="yildiz" aria-hidden="true"><span class="isin">\\ | /</span>
<span class="isin">--</span> <span class="ch oz">★</span> <span class="isin">--</span>
<span class="isin">/ | \\</span></div>`;

  // 30 kutu: 7 sıralık taç (28) + 2 kutuluk gövde. Numaralar advent takvimi gibi karışık.
  const numaralar = [17, 4, 26, 11, 29, 2, 21, 8, 14, 30, 6, 19, 1, 24, 12, 27, 9, 16, 3, 22, 13, 28, 7, 18, 25, 5, 20, 10, 15, 23];
  const yesil = ['--g1', '--g2', '--g3'], sus = ['--a1', '--a2', '--a3'];
  // Yeşil kutular ağacı okutur; renkli olanlar çapraz bir süs dizisi gibi iner.
  const renkSec = (s, i) => ((s - i) % 3 === 0 ? sus[i % 3] : yesil[(s + i) % 3]);
  let k = 0;
  const kutuYap = (renk) => {
    const no = numaralar[k++];
    const b = document.createElement('button');
    b.className = 'kutu';
    b.style.setProperty('--c', `var(${renk})`);
    b.setAttribute('aria-label', `box ${no}`);
    b.setAttribute('aria-pressed', 'false');
    b.innerHTML = `<span class="kapak">.<i>--</i>.</span><span class="no">|<b>${String(no).padStart(2, '0')}</b>|</span><span>'--'</span>`;
    b.addEventListener('click', () => b.setAttribute('aria-pressed', String(b.classList.toggle('acik'))));
    return b;
  };
  for (let s = 1; s <= 7; s++) {
    const sira = document.createElement('div');
    sira.className = 'sira';
    for (let i = 0; i < s; i++) sira.appendChild(kutuYap(renkSec(s, i)));
    agac.appendChild(sira);
  }
  const govde = document.createElement('div');
  govde.className = 'sira';
  govde.append(kutuYap('--trunk'), kutuYap('--trunk'));
  agac.appendChild(govde);

  // Ekran genişliğini karakter sayısına çevirir.
  const sutun = (el) => {
    const olcu = document.createElement('span');
    olcu.className = 'ch'; olcu.textContent = 'x'; olcu.style.cssText = 'position:absolute;visibility:hidden';
    el.appendChild(olcu);
    const w = olcu.getBoundingClientRect().width;
    olcu.remove();
    return Math.ceil(el.clientWidth / w) + 1;
  };

  // LED dizisi: düz tel, farklı boyda sarkan ampuller (8 karakterlik desen).
  const ledRenk = ['#ff8fab', '#ffd166', '#8ce0c0', '#9cc7ff', '#d6a8ff', '#ffb38a'];
  const isiklar = document.getElementById('isiklar');
  const isiklariCiz = () => {
    const n = sutun(isiklar);
    let r0 = '', r1 = '', r2 = '', a = 0;
    const ampul = () => {
      a++;
      const d = (1.5 + ((a * 37) % 19) / 10).toFixed(2), g = (((a * 53) % 29) / 10).toFixed(2);
      return `<span class="ch ampul" style="color:${ledRenk[a % ledRenk.length]};--d:${d}s;--g:-${g}s">●</span>`;
    };
    for (let x = 0; x < n; x++) {
      const p = x % 8;
      r0 += p === 2 || p === 6 ? '.' : '-';
      r1 += p === 2 ? ampul() : p === 6 ? '|' : ' ';
      r2 += p === 6 ? ampul() : ' ';
    }
    isiklar.innerHTML = `${r0}\n${r1}\n${r2}`;
  };

  // Kar zemini: iki satır tepe ve bir satır doku.
  const zemin = document.getElementById('zemin');
  const zeminiCiz = () => {
    const n = sutun(zemin);
    const d0 = "    _.--._          _.-'''-._      ";
    const d1 = "_.-'      '-.__.--''         ''--._";
    const d2 = " .  '  .   .   '  .  .   '  .   . ";
    const uzat = (d) => d.repeat(Math.ceil(n / d.length) + 1).slice(0, n);
    zemin.textContent = `${uzat(d0)}\n${uzat(d1)}\n${uzat(d2)}`;
  };
  const yerlesim = () => { isiklariCiz(); zeminiCiz(); };

  // Yön seçici: palet ve font karşılaştırması için, ürün kontrolü değil.
  const yonler = document.querySelectorAll('.yon button');
  yonler.forEach((btn) => btn.addEventListener('click', () => {
    body.dataset.yon = btn.dataset.v;
    yonler.forEach((x) => x.setAttribute('aria-pressed', String(x === btn)));
    requestAnimationFrame(yerlesim);
  }));
  const istenen = new URLSearchParams(location.search).get('yon');
  [...yonler].find((b) => b.dataset.v === istenen)?.click();
  yerlesim();
  document.fonts.ready.then(yerlesim);
  addEventListener('resize', yerlesim);

  // Kar: * - · + karakterleri, ağacın arkasında yavaşça yağar.
  const cv = document.getElementById('kar');
  const cx = cv.getContext('2d');
  const isaretler = ['*', '-', '*', '·', '+', '-', '*'];
  let taneler = [], W = 0, H = 0;
  const yeni = (ust) => ({
    x: Math.random() * W, y: ust ? -20 : Math.random() * H,
    hiz: .25 + Math.random() * .8, boy: 11 + Math.random() * 12,
    salin: Math.random() * Math.PI * 2, a: .3 + Math.random() * .55,
    c: isaretler[(Math.random() * isaretler.length) | 0],
  });
  const boyutla = () => {
    const dpr = Math.min(2, devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    taneler = Array.from({ length: Math.min(110, Math.round((W * H) / 15000)) }, () => yeni(false));
  };
  const ciz = () => {
    const st = getComputedStyle(body);
    const renk = st.getPropertyValue('--snow').trim();
    cx.clearRect(0, 0, W, H);
    for (const t of taneler) {
      cx.fillStyle = `rgba(${renk}, ${t.a})`;
      cx.font = `${t.boy}px ${st.fontFamily}`;
      cx.fillText(t.c, t.x, t.y);
    }
  };
  const akit = () => {
    for (const t of taneler) {
      t.salin += .012; t.y += t.hiz; t.x += Math.sin(t.salin) * .35;
      if (t.y > H + 20) Object.assign(t, yeni(true));
    }
    ciz();
    requestAnimationFrame(akit);
  };
  boyutla();
  addEventListener('resize', boyutla);
  if (azHareket) { ciz(); yonler.forEach((b) => b.addEventListener('click', () => requestAnimationFrame(ciz))); }
  else requestAnimationFrame(akit);
})();
</script>
</body>
</html>
