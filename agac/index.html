<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>adventcodendar · tree prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Recursive:wght,CASL,MONO@300..900,0..1,0..1&family=Sono:wght,MONO@300..800,0..1&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/maple-mono/400.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/maple-mono/700.css" rel="stylesheet">
<style>
  /* Sayfanın tamamı tek bir karakter tuvali: ağaç, tuğlalar, yıldız, ışıklar, kar ve zemin
     aynı monospace ızgarada. Yazı boyu, ağaç ekrana sığacak en büyük değere ayarlanır. */
  [data-yon="gece"] {
    --bg1: #261a38; --bg2: #382851;
    --ink: #f6ecdf; --muted: #a998bf; --wire: #7a6894;
    --w1: #9fd8b9; --w2: #7cc4a4; --w3: #c6ecd5;
    --a1: #f7a8bd; --a2: #f8dc94; --a3: #c9b6f5;
    --trunk: #d1a582; --star: #ffd98a; --snow: #e9e2f5; --glow: .35em;
    --font: "Recursive", ui-monospace, monospace; --fvs: "MONO" 1, "CASL" 1;
  }
  [data-yon="kar"] {
    --bg1: #f7f4fb; --bg2: #e4ebf7;
    --ink: #3b2f4a; --muted: #85799a; --wire: #a79cbd;
    --w1: #3f9f7b; --w2: #2f8566; --w3: #5ab892;
    --a1: #de6488; --a2: #c98f12; --a3: #8a6fd3;
    --trunk: #a8744f; --star: #e09a1c; --snow: #a99fc8; --glow: .2em;
    --font: "Maple Mono", ui-monospace, monospace; --fvs: normal;
  }
  [data-yon="pembe"] {
    --bg1: #fdeaef; --bg2: #f6d0dc;
    --ink: #5a2a3c; --muted: #a46a80; --wire: #c98ea3;
    --w1: #3f9c7a; --w2: #2e8063; --w3: #5ab08e;
    --a1: #d94873; --a2: #c98f12; --a3: #8a6fd3;
    --trunk: #b07a5c; --star: #e9a215; --snow: #cf8aa2; --glow: .2em;
    --font: "Sono", ui-monospace, monospace; --fvs: "MONO" 1;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100svh;
    background: linear-gradient(180deg, var(--bg1), var(--bg2));
    color: var(--ink);
    font-family: var(--font); font-variation-settings: var(--fvs);
    font-size: var(--fs, 18px); line-height: var(--lh, 21px);
    overflow-x: hidden;
  }

  header {
    display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 0 2ch;
    padding: 10px 1ch 4px;
  }
  .ad { font-weight: 700; }
  .yon { color: var(--muted); white-space: nowrap; }
  .yon button {
    font: inherit; font-variation-settings: inherit; color: inherit;
    background: none; border: 0; padding: 0 .5ch; cursor: pointer;
  }
  .yon button[aria-pressed="true"] { background: var(--ink); color: var(--bg1); }

  .sahne { position: relative; margin: 0 auto; }
  .sahne pre {
    position: absolute; inset: 0; margin: 0;
    font: inherit; font-variation-settings: inherit; line-height: inherit; white-space: pre;
  }
  #kar { color: var(--snow); opacity: .75; pointer-events: none; }
  #cizim { pointer-events: none; }

  .tel { color: var(--wire); }
  .ampul { animation: yan var(--d, 2.4s) ease-in-out var(--g, 0s) infinite; text-shadow: 0 0 var(--glow) currentColor; font-weight: 700; }
  @keyframes yan { 0%, 100% { opacity: 1; } 50% { opacity: .18; } }
  .duvar { font-weight: 600; }
  .gece-isik .duvar { text-shadow: 0 0 .25em currentColor; }
  .no { font-weight: 800; }
  .no.yan { color: var(--star) !important; text-shadow: 0 0 var(--glow) var(--star), 0 0 .8em var(--star); }
  .nokta { opacity: .55; }
  .parilti { color: var(--star); text-shadow: 0 0 var(--glow) var(--star); animation: yan 2.2s ease-in-out infinite; }
  .parilti.p1 { animation-delay: -.7s; } .parilti.p2 { animation-delay: -1.4s; }
  .isin { color: var(--star); animation: yan 2.8s ease-in-out infinite; }
  .isin.i1 { animation-delay: -1.4s; }
  .oz { color: var(--star); font-weight: 800; text-shadow: 0 0 var(--glow) var(--star), 0 0 1em var(--star); }
  .kapak-kar { color: var(--snow); }
  .zemin { color: var(--snow); opacity: .9; }
  .ipucu { color: var(--muted); }

  .kutu {
    position: absolute; padding: 0; border: 0; background: transparent; cursor: pointer;
    border-radius: 2px;
  }
  .kutu:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }

  @media (prefers-reduced-motion: reduce) {
    .ampul, .parilti, .isin { animation: none; }
  }
</style>
</head>
<body data-yon="gece">

<header>
  <div class="ad">adventcodendar</div>
  <div class="yon" role="group" aria-label="prototip yönü">yön <button data-v="gece" aria-pressed="true">gece</button> <button data-v="kar" aria-pressed="false">kar</button> <button data-v="pembe" aria-pressed="false">pembe</button></div>
</header>

<div class="sahne" id="sahne">
  <pre id="kar" aria-hidden="true"></pre>
  <pre id="cizim" aria-hidden="true"></pre>
</div>

<script>
(() => {
  const body = document.body;
  const sahne = document.getElementById('sahne');
  const cizim = document.getElementById('cizim');
  const karPre = document.getElementById('kar');
  const azHareket = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const hash = (x, y) => { let h = (x * 374761393 + y * 668265263) ^ 0x5bd1e995; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };

  // Ağacın katları, yukarıdan aşağı. h: kat yüksekliği (satır), c: tuğla genişlik ağırlıkları;
  // 's' ile başlayan ağırlık o sütunda üst üste iki küçük tuğla demek. Toplam 28 tuğla + 2 gövde.
  const KATLAR = [
    { h: 4, c: [1] },
    { h: 3, c: [1, 1.2] },
    { h: 4, c: [1.1, 's1', 1] },
    { h: 3, c: [1, 1.2, 0.9, 1.1] },
    { h: 4, c: ['s1', 1.3, 1, 's0.9'] },
    { h: 3, c: [1, 0.8, 1.2, 1, 1.1] },
    { h: 4, c: [1.2, 's1', 1.4, 1, 1.1] },
  ];
  const AGAC_SATIR = KATLAR.reduce((t, k) => t + k.h, 0) + 3 + 1; // taç + gövde + son duvar
  const GEREKEN_SATIR = 4 + 1 + 5 + 1 + AGAC_SATIR + 3;          // ışık, boşluk, yıldız, kar şapkası, ağaç, zemin
  const NUMARALAR = [17, 4, 26, 11, 29, 2, 21, 8, 14, 30, 6, 19, 1, 24, 12, 27, 9, 16, 3, 22, 13, 28, 7, 18, 25, 5, 20, 10, 15, 23];
  const LED = ['#ff8fab', '#ffd166', '#8ce0c0', '#9cc7ff', '#d6a8ff', '#ffb38a'];

  let W = 0, H = 0, chW = 0, satirH = 0, tuglalar = [], katlar = [], uzerinde = -1;
  const durum = new Map(); // tuğla no → { acik, kare }

  const olc = () => {
    const header = document.querySelector('header');
    const bosH = innerHeight - header.offsetHeight - 4;
    let fs = Math.floor(Math.min(bosH / (GEREKEN_SATIR * 1.16), (innerWidth - 8) / (36 * 0.6), 26));
    fs = Math.max(12, fs);
    satirH = Math.round(fs * 1.16);
    while (fs > 12 && satirH * GEREKEN_SATIR > bosH) { fs--; satirH = Math.round(fs * 1.16); }
    body.style.setProperty('--fs', fs + 'px');
    body.style.setProperty('--lh', satirH + 'px');
    const m = document.createElement('span');
    m.textContent = 'x'.repeat(100);
    m.style.cssText = 'position:absolute;visibility:hidden;white-space:pre';
    sahne.appendChild(m);
    chW = m.getBoundingClientRect().width / 100;
    m.remove();
    W = Math.floor(innerWidth / chW);
    H = Math.max(GEREKEN_SATIR, Math.floor(bosH / satirH));
    sahne.style.width = (W * chW) + 'px';
    sahne.style.height = (H * satirH) + 'px';
  };

  // Tuğla yerleşimi: katların genişliği tepeden tabana doğrusal büyür, hepsi ortalı.
  const kur = () => {
    const cift = (n) => n - (n % 2);
    const altW = cift(Math.min(W - 8, Math.max(34, Math.round((1.15 * AGAC_SATIR * satirH) / chW))));
    const ustW = Math.max(8, cift(Math.round(altW * 0.2)));
    const cx = Math.floor(W / 2);
    const gY1 = H - 4, gH = 3, gY0 = gY1 - gH;          // gövde, zeminin hemen üstünde
    let y = gY0 - KATLAR.reduce((t, k) => t + k.h, 0);   // tacın tepesi
    tuglalar = []; katlar = [];
    KATLAR.forEach((kat, ki) => {
      const w = cift(Math.round(ustW + ((altW - ustW) * ki) / (KATLAR.length - 1)));
      const x0 = cx - w / 2, x1 = cx + w / 2, y0 = y, y1 = y + kat.h;
      katlar.push({ x0, x1, y0, y1 });
      const agirlik = kat.c.map((v) => (typeof v === 'string' ? parseFloat(v.slice(1)) : v));
      const top = agirlik.reduce((a, b) => a + b, 0);
      let birikim = 0, onceki = x0;
      kat.c.forEach((v, i) => {
        birikim += agirlik[i];
        const sag = i === kat.c.length - 1 ? x1 : x0 + Math.round((w * birikim) / top);
        const renk = ki < 2 ? '--w3' : ki < 4 ? '--w1' : '--w2';
        if (typeof v === 'string') {
          const ym = y0 + Math.floor(kat.h / 2);
          tuglalar.push({ x0: onceki, x1: sag, y0, y1: ym, renk });
          tuglalar.push({ x0: onceki, x1: sag, y0: ym, y1, renk });
        } else tuglalar.push({ x0: onceki, x1: sag, y0, y1, renk });
        onceki = sag;
      });
      y = y1;
    });
    const gW = Math.max(8, cift(Math.round(altW * 0.2)));
    tuglalar.push({ x0: cx - gW / 2, x1: cx, y0: gY0, y1: gY1, renk: '--trunk' });
    tuglalar.push({ x0: cx, x1: cx + gW / 2, y0: gY0, y1: gY1, renk: '--trunk' });
    const sus = ['--a1', '--a2', '--a3'];
    tuglalar.forEach((t, i) => {
      t.no = NUMARALAR[i];
      t.sus = t.renk !== '--trunk' && i % 3 === 1 ? sus[Math.floor(i / 3) % 3] : null;
      if (!durum.has(t.no)) durum.set(t.no, { acik: false, kare: 0 });
    });
    dugmeleriKur();
  };

  // Izgaraya yazma.
  let C, T;
  const yaz = (x, y, c, etiket) => { if (x >= 0 && x < W && y >= 0 && y < H) { C[y][x] = c; T[y][x] = etiket; } };
  const metin = (x, y, s, etiket) => { for (let i = 0; i < s.length; i++) if (s[i] !== ' ') yaz(x + i, y, s[i], etiket); };
  const renkli = (sinif, renk, ek = '') => `<span class="${sinif}" style="color:var(${renk})${ek}">`;

  const ciz = () => {
    C = Array.from({ length: H }, () => Array(W).fill(' '));
    T = Array.from({ length: H }, () => Array(W).fill(''));
    let ampulSayac = 0;
    const ampul = (x, y) => {
      ampulSayac++;
      const d = (1.5 + ((ampulSayac * 37) % 19) / 10).toFixed(2), g = (((ampulSayac * 53) % 29) / 10).toFixed(2);
      yaz(x, y, 'o', `<span class="ampul" style="color:${LED[ampulSayac % LED.length]};--d:${d}s;--g:-${g}s">`);
    };

    // Zemin: üç satır kar tepesi; ortasında ipucu.
    const z0 = "    _.--._          _.-'''-._      ", z1 = "_.-'      '-.__.--''         ''--._", z2 = " .  '  .   .   '  .  .   '  .   . ";
    for (let x = 0; x < W; x++) {
      yaz(x, H - 3, z0[x % z0.length], '<span class="zemin">');
      yaz(x, H - 2, z1[x % z1.length], '<span class="zemin">');
      yaz(x, H - 1, z2[x % z2.length], '<span class="zemin">');
    }
    const ipucu = '  tap a box to open it  ';
    const ix = Math.floor((W - ipucu.length) / 2);
    for (let i = 0; i < ipucu.length; i++) yaz(ix + i, H - 1, ipucu[i], '<span class="ipucu">');

    // Girland: iki satırlık kavisli tel, tel boyunca bir satır aşağıda sarkan ampuller.
    const g0 = "'-._        _.-'", g1 = "    '-.__.-'    ";
    const telSatiri = (x) => (g0[x % 16] !== ' ' ? 0 : 1);
    for (let x = 0; x < W; x++) {
      if (g0[x % 16] !== ' ') yaz(x, 0, g0[x % 16], '<span class="tel">');
      if (g1[x % 16] !== ' ') yaz(x, 1, g1[x % 16], '<span class="tel">');
      if (x % 4 === 2) ampul(x, telSatiri(x) + 1);
    }

    // Ağacın kenarındaki boşlukta, telden sarkan farklı boylarda ışık dizileri.
    const enSol = katlar[katlar.length - 1].x0, enSag = katlar[katlar.length - 1].x1;
    for (let x = 4; x < W - 2; x += 7) {
      if (x > enSol - 5 && x < enSag + 5) continue;
      const bas = telSatiri(x) + 1, boy = 5 + Math.floor(hash(x, 7) * Math.min(14, H - 12));
      for (let y = bas; y < bas + boy && y < H - 4; y++) {
        if ((y - bas) % 3 === 2 || y === bas + boy - 1) ampul(x, y); else yaz(x, y, ':', '<span class="tel">');
      }
    }

    // Tuğla duvarları: ortak duvarlar tek çizilir, köşe ve kesişim karakteri komşulara göre seçilir.
    const bayrak = Array.from({ length: H }, () => Array(W).fill(0)); // 1 yukarı, 2 aşağı, 4 sol, 8 sağ
    const renkH = Array.from({ length: H }, () => Array(W).fill(null));
    const isle = (x, y, b, r) => { if (x >= 0 && x < W && y >= 0 && y < H) { bayrak[y][x] |= b; renkH[y][x] = r; } };
    const sirali = [...tuglalar].sort((a, b) => (a.renk === '--trunk') - (b.renk === '--trunk')).reverse();
    for (const t of sirali) {
      for (let x = t.x0; x <= t.x1; x++) {
        const b = (x > t.x0 ? 4 : 0) | (x < t.x1 ? 8 : 0);
        isle(x, t.y0, b, t.renk); isle(x, t.y1, b, t.renk);
      }
      for (let y = t.y0; y <= t.y1; y++) {
        const b = (y > t.y0 ? 1 : 0) | (y < t.y1 ? 2 : 0);
        isle(t.x0, y, b, t.renk); isle(t.x1, y, b, t.renk);
      }
    }
    const secili = tuglalar[uzerinde];
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const b = bayrak[y][x];
      if (!b) continue;
      const yatay = b & 12, dikey = b & 3, kol = [1, 2, 4, 8].filter((k) => b & k).length;
      let c = '+';
      if (!dikey) c = '-';
      else if (!yatay) c = '|';
      else if (kol === 2) c = b & 2 ? '.' : "'";
      const kenar = secili && (x === secili.x0 || x === secili.x1 || y === secili.y0 || y === secili.y1) && x >= secili.x0 && x <= secili.x1 && y >= secili.y0 && y <= secili.y1;
      yaz(x, y, c, renkli('duvar', kenar ? '--ink' : renkH[y][x]));
    }

    // Tuğla içleri: numara ortada; süslü tuğlalarda seyrek nokta deseni; açılınca parıltı.
    for (const t of tuglalar) {
      const st = durum.get(t.no);
      const iw = t.x1 - t.x0 - 1, ih = t.y1 - t.y0 - 1;
      const ny = t.y0 + Math.floor((t.y1 - t.y0) / 2);
      const ns = String(t.no), nx = t.x0 + 1 + Math.floor((iw - ns.length) / 2);
      for (let r = 0; r < ih; r++) {
        const y = t.y0 + 1 + r;
        const acikSatir = r < st.kare;
        for (let x = t.x0 + 1; x < t.x1; x++) {
          if (y === ny && x >= nx - 1 && x <= nx + ns.length) continue;
          if (acikSatir) {
            const h = hash(x, y);
            if (h < 0.42) yaz(x, y, h < 0.1 ? '*' : h < 0.2 ? '+' : h < 0.32 ? '.' : "'", `<span class="parilti p${(x + y) % 3}">`);
          } else if (t.sus && (x + y * 2) % 4 === 0) yaz(x, y, '·', renkli('nokta', t.sus));
        }
        if (y === ny) {
          const acikNo = acikSatir;
          metin(nx, y, ns, acikNo ? '<span class="no yan">' : renkli('no', t.sus || '--ink'));
        }
      }
    }

    // Omuzlarda kar şapkası ve dal uçlarında ampul.
    katlar.forEach((k, i) => {
      const ust = i > 0 ? katlar[i - 1] : null;
      const sapka = (a, b) => { for (let x = a; x <= b; x++) yaz(x, k.y0 - 1, '.:'[x % 2], '<span class="kapak-kar">'); };
      if (ust) { sapka(k.x0, ust.x0 - 1); sapka(ust.x1 + 1, k.x1); } else sapka(k.x0, k.x1);
      ampul(k.x0 - 1, k.y0 + 1); ampul(k.x1 + 1, k.y0 + 1);
    });

    // Yıldız: karakterlerden bir parıltı, ışınları yanıp söner.
    const tepe = katlar[0], sx = Math.floor((tepe.x0 + tepe.x1) / 2), sy = tepe.y0 - 7;
    const yildiz = [" .  |  . ", "  '.|.'  ", "--==*==--", "  .'|'.  ", " '  |  ' "];
    yildiz.forEach((s, r) => {
      for (let i = 0; i < s.length; i++) {
        if (s[i] === ' ') continue;
        const merkez = r === 2 && i === 4;
        yaz(sx - 4 + i, sy + r, s[i], merkez ? '<span class="oz">' : `<span class="isin i${(i + r) % 2}">`);
      }
    });

    // HTML: aynı etiketli komşu hücreler tek span olur.
    let html = '';
    for (let y = 0; y < H; y++) {
      let acik = '';
      for (let x = 0; x < W; x++) {
        const e = T[y][x];
        if (e !== acik) { if (acik) html += '</span>'; if (e) html += e; acik = e; }
        const c = C[y][x];
        html += c === '<' ? '&lt;' : c === '>' ? '&gt;' : c === '&' ? '&amp;' : c;
      }
      if (acik) html += '</span>';
      html += '\n';
    }
    cizim.innerHTML = html;
    maskeyiGuncelle();
  };

  // Tıklanabilir alanlar: her tuğlanın üstünde görünmez bir düğme.
  const dugmeleriKur = () => {
    sahne.querySelectorAll('.kutu').forEach((b) => b.remove());
    tuglalar.forEach((t, i) => {
      const b = document.createElement('button');
      b.className = 'kutu';
      b.style.cssText = `left:${t.x0 * chW}px;top:${t.y0 * satirH}px;width:${(t.x1 - t.x0 + 1) * chW}px;height:${(t.y1 - t.y0 + 1) * satirH}px`;
      b.setAttribute('aria-label', `box ${t.no}`);
      b.setAttribute('aria-pressed', String(durum.get(t.no).acik));
      b.addEventListener('pointerenter', () => { uzerinde = i; ciz(); });
      b.addEventListener('pointerleave', () => { if (uzerinde === i) { uzerinde = -1; ciz(); } });
      b.addEventListener('focus', () => { uzerinde = i; ciz(); });
      b.addEventListener('blur', () => { if (uzerinde === i) { uzerinde = -1; ciz(); } });
      b.addEventListener('click', () => ac(t, b));
      sahne.appendChild(b);
    });
  };

  // Açılış: tuğlanın içi yukarıdan aşağı satır satır parıltıyla dolar; tekrar tıklayınca kapanır.
  const ac = (t, b) => {
    const st = durum.get(t.no);
    st.acik = !st.acik;
    b.setAttribute('aria-pressed', String(st.acik));
    const hedef = st.acik ? t.y1 - t.y0 - 1 : 0;
    if (azHareket) { st.kare = hedef; ciz(); return; }
    const adim = () => {
      if (st.kare === hedef) return;
      st.kare += st.kare < hedef ? 1 : -1;
      ciz();
      setTimeout(adim, 70);
    };
    adim();
  };

  // Kar: ızgarada hücre hücre düşer; ağacın, ışıkların ve yazıların olduğu hücrelere girmez.
  let maske = [], taneler = [];
  const maskeyiGuncelle = () => {
    maske = C.map((satir) => satir.map((c) => c !== ' '));
    for (const k of katlar) for (let y = k.y0; y <= k.y1; y++) for (let x = k.x0; x <= k.x1; x++) if (maske[y]) maske[y][x] = true;
  };
  const isaretler = ['*', '-', '*', '.', '+', '-', '*', "'"];
  const yeniTane = (ust) => ({ x: Math.floor(Math.random() * W), y: ust ? 0 : Math.floor(Math.random() * (H - 4)), hiz: 2 + Math.floor(Math.random() * 4), t: 0, c: isaretler[Math.floor(Math.random() * isaretler.length)] });
  const karKur = () => { taneler = Array.from({ length: Math.round((W * H) / 38) }, () => yeniTane(false)); };
  const karCiz = () => {
    const satirlar = Array.from({ length: H }, () => Array(W).fill(' '));
    for (const k of taneler) if (k.y < H && !(maske[k.y] && maske[k.y][k.x])) satirlar[k.y][k.x] = k.c;
    karPre.textContent = satirlar.map((s) => s.join('')).join('\n');
  };
  const karAkit = () => {
    for (const k of taneler) {
      if (++k.t < k.hiz) continue;
      k.t = 0; k.y++;
      if (Math.random() < 0.18) k.x = (k.x + (Math.random() < 0.5 ? -1 : 1) + W) % W;
      if (k.y >= H - 3) Object.assign(k, yeniTane(true));
    }
    karCiz();
  };

  const hepsi = () => { olc(); kur(); ciz(); karKur(); karCiz(); };

  // Yön seçici: palet ve font karşılaştırması için, ürün kontrolü değil.
  const yonler = document.querySelectorAll('.yon button');
  yonler.forEach((btn) => btn.addEventListener('click', () => {
    body.dataset.yon = btn.dataset.v;
    body.classList.toggle('gece-isik', btn.dataset.v === 'gece');
    yonler.forEach((x) => x.setAttribute('aria-pressed', String(x === btn)));
    requestAnimationFrame(hepsi);
  }));
  body.classList.add('gece-isik');
  const istenen = new URLSearchParams(location.search).get('yon');
  [...yonler].find((b) => b.dataset.v === istenen)?.click();

  hepsi();
  document.fonts.ready.then(hepsi);
  let zaman;
  addEventListener('resize', () => { clearTimeout(zaman); zaman = setTimeout(hepsi, 120); });
  if (!azHareket) setInterval(karAkit, 110);
})();
</script>
</body>
</html>
