<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>adventcodendar · tree prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Recursive:wght,CASL,MONO@300..900,0..1,0..1&family=Sono:wght,MONO@300..800,0..1&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/maple-mono/400.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/maple-mono/600.css" rel="stylesheet">
<style>
  :root {
    --gutter: clamp(16px, 3vw, 40px);
    --b: clamp(38px, min(11.2vw, 6.6vh), 74px);
    --gap: calc(var(--b) * 0.16);
    --t-body: clamp(17px, 1.4vw, 20px);
    --t-small: clamp(14px, 1.1vw, 16px);
  }
  [data-yon="gece"] {
    --bg1: #2a1d3d; --bg2: #3b2a55;
    --ink: #f6ecdf; --muted: #b8a9cc;
    --g1: #9fd8b9; --g2: #7cc4a4; --g3: #bfe8cf;
    --a1: #f7b8c8; --a2: #f8e0a0; --a3: #cdbdf2;
    --trunk: #c9a07f; --no: #2a1d3d; --hole: #1b1226;
    --star: #ffd98a; --snow: 233, 226, 245; --bank: rgba(233, 226, 245, .10);
    --wire: #18101f;
    --font: "Recursive", ui-monospace, monospace;
    --fvs: "MONO" 1, "CASL" 1;
  }
  [data-yon="kar"] {
    --bg1: #f6f3fb; --bg2: #e6ecf7;
    --ink: #3b2f4a; --muted: #7d7192;
    --g1: #8fd3b8; --g2: #6fbf9f; --g3: #b5e3cc;
    --a1: #f29bb2; --a2: #f3cf72; --a3: #b49ee8;
    --trunk: #c4987a; --no: #3b2f4a; --hole: #6d6488;
    --star: #f2b84b; --snow: 150, 140, 190; --bank: rgba(255, 255, 255, .85);
    --wire: #6b5f80;
    --font: "Maple Mono", ui-monospace, monospace;
    --fvs: normal;
  }
  [data-yon="pembe"] {
    --bg1: #fde9ee; --bg2: #f8d2dd;
    --ink: #5a2a3c; --muted: #a0687c;
    --g1: #bfe9d6; --g2: #9ad7bd; --g3: #d6f2e4;
    --a1: #f58fa9; --a2: #ffe29a; --a3: #fffaf3;
    --trunk: #d8a88c; --no: #5a2a3c; --hole: #7a3d55;
    --star: #ffc94d; --snow: 205, 120, 150; --bank: rgba(255, 255, 255, .7);
    --wire: #8a5468;
    --font: "Sono", ui-monospace, monospace;
    --fvs: "MONO" 1;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    min-height: 100svh; display: flex; flex-direction: column;
    background: linear-gradient(180deg, var(--bg1), var(--bg2));
    color: var(--ink);
    font-family: var(--font);
    font-variation-settings: var(--fvs);
    font-size: var(--t-body);
    overflow-x: hidden;
    transition: background .4s ease, color .4s ease;
  }

  #kar { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }

  header {
    position: relative; z-index: 3;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    padding: 18px var(--gutter) 0;
  }
  .ad { font-weight: 600; letter-spacing: .01em; }
  .yon { display: flex; align-items: center; gap: 4px; font-size: var(--t-small); color: var(--muted); }
  .yon button {
    font: inherit; font-variation-settings: inherit; color: inherit;
    background: none; border: 0; padding: 6px 10px; border-radius: 8px; cursor: pointer;
  }
  .yon button[aria-pressed="true"] { color: var(--ink); background: rgba(127, 127, 127, .16); }

  #isiklar { position: relative; z-index: 2; display: block; width: 100%; height: 84px; margin-top: 6px; overflow: visible; }
  #isiklar path { fill: none; stroke: var(--wire); stroke-width: 1.6; }
  .ampul { animation: yan var(--d, 2.4s) ease-in-out var(--g, 0s) infinite; }
  .ampul .cam { fill: currentColor; filter: drop-shadow(0 0 4px currentColor) drop-shadow(0 0 10px currentColor); }
  .ampul .sapka { fill: var(--wire); }
  @keyframes yan { 0%, 100% { opacity: 1; } 50% { opacity: .22; } }

  main {
    position: relative; z-index: 1; flex: 1;
    display: grid; justify-items: center;
    padding: 0 var(--gutter) 0;
  }
  .agac { display: grid; justify-items: center; gap: var(--gap); }
  .yildiz { width: calc(var(--b) * 1.05); height: calc(var(--b) * 1.05); margin-bottom: calc(var(--gap) * .3); }
  .yildiz path { fill: var(--star); filter: drop-shadow(0 0 10px var(--star)); }
  .sira { display: flex; gap: var(--gap); }
  .govde { margin-top: calc(var(--gap) * .4); }

  .kutu {
    position: relative; width: var(--b); height: var(--b);
    padding: 0; border: 0; background: none; cursor: pointer;
    font: inherit; font-variation-settings: inherit; color: inherit;
    perspective: 420px; border-radius: calc(var(--b) * .14);
    transition: transform .18s ease;
  }
  .kutu:hover { transform: translateY(-3px); }
  .kutu:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .ic, .kapak {
    position: absolute; inset: 0; border-radius: inherit;
    display: grid; place-items: center;
  }
  .ic {
    background: color-mix(in oklab, var(--c) 40%, var(--hole));
    box-shadow: inset 0 2px 8px rgba(0, 0, 0, .3);
    color: var(--star); font-size: calc(var(--b) * .38);
    align-content: center; gap: 0; line-height: 1;
  }
  .ic small { font-size: calc(var(--b) * .2); color: #fff; opacity: 0; transition: opacity .25s ease .3s; }
  .kutu.acik .ic small { opacity: .8; }
  .ic span { opacity: 0; transform: scale(.4); transition: opacity .25s ease .25s, transform .35s cubic-bezier(.3, 1.6, .5, 1) .25s; }
  .kapak {
    background: var(--c); color: var(--no);
    font-size: calc(var(--b) * .42); font-weight: 600;
    box-shadow: 0 3px 0 color-mix(in oklab, var(--c) 72%, #000), 0 6px 14px rgba(0, 0, 0, .18);
    transform-origin: left center;
    transition: transform .55s cubic-bezier(.45, .05, .25, 1), box-shadow .3s ease;
    backface-visibility: hidden;
  }
  .kutu.acik .kapak { transform: rotateY(-112deg); box-shadow: none; }
  .kutu.acik .ic span { opacity: 1; transform: scale(1); }
  .kutu.acik:hover { transform: none; }

  .ipucu { margin: calc(var(--gap) * 2.2) 0 0; font-size: var(--t-small); color: var(--muted); text-align: center; }

  .kartopu {
    position: relative; z-index: 1; display: block; width: 100%; height: clamp(60px, 9vh, 110px);
    margin-top: calc(var(--gap) * -1.5); flex: none;
  }
  .kartopu path { fill: var(--bank); }

  @media (prefers-reduced-motion: reduce) {
    .ampul { animation: none; }
    .kapak, .ic span, .kutu { transition: none; }
  }
</style>
</head>
<body data-yon="gece">
<canvas id="kar" aria-hidden="true"></canvas>

<header>
  <div class="ad">adventcodendar</div>
  <div class="yon" role="group" aria-label="prototip yönü">
    <span>yön:</span>
    <button data-v="gece" aria-pressed="true">gece</button>
    <button data-v="kar" aria-pressed="false">kar</button>
    <button data-v="pembe" aria-pressed="false">pembe</button>
  </div>
</header>

<svg id="isiklar" aria-hidden="true"></svg>

<main>
  <div class="agac" id="agac">
    <svg class="yildiz" viewBox="0 0 100 100" aria-hidden="true">
      <path d="M50 6 L61.8 37.6 L95.1 38.2 L69 59 L78.5 91 L50 72.2 L21.5 91 L31 59 L4.9 38.2 L38.2 37.6 Z" stroke-linejoin="round"/>
    </svg>
  </div>
  <p class="ipucu">tap a box to open it</p>
</main>

<svg class="kartopu" viewBox="0 0 1000 100" preserveAspectRatio="none" aria-hidden="true">
  <path d="M0 60 C 160 20, 330 18, 500 34 C 680 50, 840 14, 1000 40 L1000 100 L0 100 Z"/>
</svg>

<script>
(() => {
  const body = document.body;
  const azHareket = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // 30 kutu: 7 sıralık taç (1+2+…+7 = 28) ve 2 kutuluk gövde. Numaralar gerçek advent takvimleri gibi karışık.
  const numaralar = [17, 4, 26, 11, 29, 2, 21, 8, 14, 30, 6, 19, 1, 24, 12, 27, 9, 16, 3, 22, 13, 28, 7, 18, 25, 5, 20, 10, 15, 23];
  const yesil = ['--g1', '--g2', '--g3'], sus = ['--a1', '--a2', '--a3'];
  // Yeşiller ağacı okutur; renkli kutular çapraz bir süs dizisi gibi iner.
  const renkSec = (s, i) => ((s - i) % 3 === 0 ? sus[i % 3] : yesil[(s + i) % 3]);
  const agac = document.getElementById('agac');
  let k = 0;

  const kutuYap = (renk) => {
    const no = numaralar[k++];
    const b = document.createElement('button');
    b.className = 'kutu';
    b.style.setProperty('--c', `var(${renk})`);
    b.setAttribute('aria-label', `box ${no}`);
    b.setAttribute('aria-pressed', 'false');
    b.innerHTML = `<span class="ic"><span>✦</span><small>${no}</small></span><span class="kapak">${no}</span>`;
    b.addEventListener('click', () => {
      const acik = b.classList.toggle('acik');
      b.setAttribute('aria-pressed', String(acik));
    });
    return b;
  };

  for (let s = 1; s <= 7; s++) {
    const sira = document.createElement('div');
    sira.className = 'sira';
    for (let i = 0; i < s; i++) sira.appendChild(kutuYap(renkSec(s, i)));
    agac.appendChild(sira);
  }
  const govde = document.createElement('div');
  govde.className = 'sira govde';
  govde.appendChild(kutuYap('--trunk'));
  govde.appendChild(kutuYap('--trunk'));
  agac.appendChild(govde);

  // Yön seçici: palet ve font karşılaştırması için, ürün kontrolü değil.
  document.querySelectorAll('.yon button').forEach((btn) => {
    btn.addEventListener('click', () => {
      body.dataset.yon = btn.dataset.v;
      document.querySelectorAll('.yon button').forEach((x) => x.setAttribute('aria-pressed', String(x === btn)));
    });
  });
  const istenen = new URLSearchParams(location.search).get('yon');
  if (istenen) document.querySelector(`.yon button[data-v="${istenen}"]`)?.click();

  // LED dizisi: sayfa genişliğinde sarkan teller, ampuller kendi temposunda yanıp söner.
  const svg = document.getElementById('isiklar');
  const ledRenk = ['#ff8fab', '#ffd166', '#8ce0c0', '#9cc7ff', '#d6a8ff', '#ffb38a'];
  const isiklariCiz = () => {
    const w = svg.clientWidth;
    const n = Math.max(2, Math.round(w / 280));
    const genis = w / n;
    let html = '';
    let r = 0;
    for (let i = 0; i < n; i++) {
      const x0 = i * genis, x1 = x0 + genis, cx = x0 + genis / 2;
      html += `<path d="M${x0} 6 Q${cx} 74 ${x1} 6"/>`;
      for (let j = 1; j <= 5; j++) {
        const t = j / 6;
        const x = (1 - t) * (1 - t) * x0 + 2 * (1 - t) * t * cx + t * t * x1;
        const y = (1 - t) * (1 - t) * 6 + 2 * (1 - t) * t * 74 + t * t * 6;
        const renk = ledRenk[r++ % ledRenk.length];
        const d = (1.6 + ((r * 37) % 17) / 10).toFixed(2);
        const g = (((r * 53) % 23) / 10).toFixed(2);
        html += `<g class="ampul" style="color:${renk};--d:${d}s;--g:-${g}s" transform="translate(${x.toFixed(1)} ${y.toFixed(1)})">
          <rect class="sapka" x="-3" y="-2" width="6" height="5" rx="1.5"/>
          <ellipse class="cam" cx="0" cy="9" rx="4.6" ry="7"/></g>`;
      }
    }
    svg.innerHTML = html;
  };
  isiklariCiz();
  addEventListener('resize', isiklariCiz);

  // Kar: * - · + karakterleri, ağacın arkasında yavaşça yağar.
  const cv = document.getElementById('kar');
  const cx = cv.getContext('2d');
  const isaretler = ['*', '-', '*', '·', '+', '-', '*'];
  let taneler = [], W = 0, H = 0, dpr = 1;
  const yeni = (ust) => ({
    x: Math.random() * W,
    y: ust ? -20 : Math.random() * H,
    hiz: .25 + Math.random() * .8,
    boy: 11 + Math.random() * 12,
    salin: Math.random() * Math.PI * 2,
    a: .3 + Math.random() * .55,
    c: isaretler[(Math.random() * isaretler.length) | 0],
  });
  const boyutla = () => {
    dpr = Math.min(2, devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const adet = Math.min(110, Math.round((W * H) / 15000));
    taneler = Array.from({ length: adet }, () => yeni(false));
  };
  const ciz = () => {
    const renk = getComputedStyle(body).getPropertyValue('--snow').trim();
    const font = getComputedStyle(body).fontFamily;
    cx.clearRect(0, 0, W, H);
    for (const t of taneler) {
      cx.fillStyle = `rgba(${renk}, ${t.a})`;
      cx.font = `${t.boy}px ${font}`;
      cx.fillText(t.c, t.x, t.y);
    }
  };
  const akit = () => {
    for (const t of taneler) {
      t.salin += .012;
      t.y += t.hiz;
      t.x += Math.sin(t.salin) * .35;
      if (t.y > H + 20) Object.assign(t, yeni(true));
    }
    ciz();
    requestAnimationFrame(akit);
  };
  boyutla();
  addEventListener('resize', boyutla);
  if (azHareket) {
    ciz();
    document.querySelectorAll('.yon button').forEach((b) => b.addEventListener('click', () => requestAnimationFrame(ciz)));
  } else {
    requestAnimationFrame(akit);
  }
})();
</script>
</body>
</html>
