<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>adventcodendar</title>
<meta name="description" content="30 boxes, a real problem in each. solve it with whatever you want.">
<meta name="theme-color" content="#0b0b0c">
<link rel="icon" href="data:,">
<style>
  /* Terminal çerçevesi (30 Eki) + dewguard / portfolyo bahçesi yazısı ve rengi (1 Kas 2026, Damla):
     siyah #0b0b0c, başlık tek sans, küçük harf; komut satırı, çizim ve durum çubuğu monospace.
     Süsler 30 Eki'dekiler: girland, sarkan ışık dizileri, dal ucu ampulleri, yıldız, kar.
     Hiçbir şey kendiliğinden parlamaz; parlama yalnız üstüne gelinen ya da açılan kutuda. */
  :root {
    color-scheme: dark;
    --bg: #0b0b0c; --panel: #161618; --ink: #ededef; --ink2: #a0a0a8;
    --leaf: #8ed38a; --leaf2: #5fae6e; --leaf3: #bfe9b8; --apple: #ff8a7a; --bark: #b38b6d;
    --light: #ffd76a; --star: #5f5f6b; --star2: #d6d6e0; --pink: #f5a3c0; --yellow: #f3d47a; --lilac: #b7a5f4; --sky: #8ec5ff;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: "SF Mono", SFMono-Regular, ui-monospace, Menlo, Consolas, "Liberation Mono", monospace;
    --pad: max(20px, 5vw, calc((100% - 1600px) / 2));
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 17px/1.6 var(--sans); overflow-x: hidden; text-transform: lowercase; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; cursor: pointer; text-transform: inherit; }
  :focus-visible { outline: 2px solid var(--ink2); outline-offset: 4px; }

  /* başlık bir komut satırı: tree yazılır, ağaç çıktı gibi basılır */
  header.site { position: absolute; top: 0; left: 0; right: 0; z-index: 5; display: flex; align-items: center; gap: 28px; padding: 22px var(--pad); font-size: 15px; }
  .prompt { font: 400 15px/1.4 var(--mono); white-space: pre; text-transform: none; }
  .prompt .user { color: var(--leaf); font-weight: 700; }
  .prompt .host { color: var(--lilac); font-weight: 700; }
  .prompt .path { color: var(--yellow); }
  .prompt .cmd { font-weight: 700; }
  .cursor { animation: cursor 1.1s steps(1) infinite; }
  @keyframes cursor { 50% { opacity: 0; } }
  header.site .right { margin-left: auto; display: flex; gap: 28px; align-items: center; }
  header.site .right a, header.site .right button { color: var(--ink2); background: none; border: 0; padding: 0; font-size: 15px; }
  header.site .right a:hover, header.site .right button:hover { color: var(--ink); }

  .hero { position: relative; height: calc(100svh - 24px); overflow: hidden; }
  .hero pre { position: absolute; inset: 0; margin: 0; font: 400 var(--fs, 15px)/var(--lh, 17px) var(--mono); white-space: pre; pointer-events: none; user-select: none; }
  #snow { color: var(--star2); opacity: .55; }

  .words { position: absolute; z-index: 2; left: var(--pad); top: 120px; visibility: hidden; }
  .words.shown { visibility: visible; }
  .words h1 { margin: 0; font-size: clamp(48px, 4.6vw, 80px); font-weight: 600; letter-spacing: -.045em; line-height: 1; }
  .words p { margin: 16px 0 0; font-size: 20px; line-height: 1.5; color: var(--ink2); }
  .words p span { display: block; }
  .stack .words { left: 0; right: 0; text-align: center; padding: 0 16px; }
  .stack .words h1 { font-size: 40px; }
  .stack .words p { font-size: 17px; margin-top: 12px; }

  /* alt durum çubuğu: tmux gibi; solda mod ve gerçek sayım, sağda saat */
  .bar { display: flex; justify-content: space-between; gap: 0 2ch; height: 24px; background: var(--panel); color: var(--ink2); font: 400 15px/24px var(--mono); white-space: pre; text-transform: none; overflow: hidden; }
  .bar .mode { background: var(--leaf); color: var(--bg); font-weight: 700; }
  .bar .count { color: var(--ink); }
  .bar .side a { display: none; color: var(--ink2); }
  .bar .side a:hover { color: var(--ink); }

  /* çizimin renkleri, bahçeyle aynı */
  .leaf{color:var(--leaf)}.leaf2{color:var(--leaf2)}.leaf3{color:var(--leaf3)}.apple{color:var(--apple)}.bark{color:var(--bark)}
  .light{color:var(--light)}.star{color:var(--star)}.star2{color:var(--star2)}.pink{color:var(--pink)}.yellow{color:var(--yellow)}
  .lilac{color:var(--lilac)}.sky{color:var(--sky)}.ink{color:var(--ink)}.ink2{color:var(--ink2)}

  /* parlama bir sebeple: üstüne gelinen kutunun kenarı, açılan kutunun içi */
  .hot { text-shadow: 0 0 6px currentColor, 0 0 16px currentColor; }
  .bulb { animation: twinkle var(--d, 3s) ease-in-out var(--g, 0s) infinite; font-weight: 700; }
  @keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  .ray { animation: twinkle 3.6s ease-in-out infinite; }
  .ray.r1 { animation-delay: -1.8s; }
  .core { font-weight: 700; }
  .no { font-weight: 600; }
  .lit { color: var(--light); }
  .spark { color: var(--light); animation: twinkle 3.2s ease-in-out infinite; }
  .spark.s1 { animation-delay: -1.1s; } .spark.s2 { animation-delay: -2.2s; }
  .paused .bulb, .paused .ray, .paused .spark, .paused .cursor { animation-play-state: paused; }

  .box { position: absolute; z-index: 3; padding: 0; border: 0; background: transparent; cursor: pointer; }
  .box:focus-visible { outline: none; }

  @media (prefers-reduced-motion: reduce) {
    .bulb, .ray, .spark, .cursor { animation: none; }
  }
  @media (max-width: 560px) {
    header.site { padding: 16px; gap: 16px; }
    header.site .right { gap: 16px; }
    header.site .right .gh { display: none; }
    .bar .clock { display: none; }
    .bar .side a { display: inline; }
  }
</style>
</head>
<body>

<header class="site">
  <span class="prompt"><span class="user">guest</span>@<span class="host">adventcodendar</span>:<span class="path">~</span>$ <span class="cmd" id="cmd"></span><span class="cursor">_</span></span>
  <div class="right">
    <a class="gh" href="https://github.com/nosey-dewdrop/adventcodendar">github</a>
    <button id="motion" type="button" aria-pressed="false">pause</button>
  </div>
</header>

<main class="hero" id="hero">
  <pre id="scene" aria-hidden="true"></pre>
  <pre id="snow" aria-hidden="true"></pre>
  <div class="words" id="words">
    <h1>adventcodendar</h1>
    <p><span>30 boxes, a real problem in each.</span> <span>solve it with whatever you want.</span></p>
  </div>
</main>

<footer class="bar">
  <div><span class="mode"> tree </span><span class="count" id="status"> tap a box to open it </span></div>
  <div class="side"><span class="clock" id="clock"></span><a href="https://github.com/nosey-dewdrop/adventcodendar">github </a></div>
</footer>

<script>
(() => {
  const body = document.body;
  const hero = document.getElementById('hero');
  const scene = document.getElementById('scene');
  const snowPre = document.getElementById('snow');
  const words = document.getElementById('words');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const hash = (x, y) => { let h = (x * 374761393 + y * 668265263) ^ 0x5bd1e995; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };

  // *-*-*-*-*-*-*-*-*-*-*-* ağaç *-*-*-*-*-*-*-*-*-*-*-*
  // Katlar yukarıdan aşağı. h: kat yüksekliği (satır), c: tuğla genişlik ağırlıkları;
  // 's' ile başlayan ağırlık o sütunda üst üste iki küçük tuğla demek. 28 tuğla + 2 gövde = 30 kutu.
  const TIERS = [
    { h: 4, c: [1] },
    { h: 3, c: [1, 1.2] },
    { h: 4, c: [1.1, 's1', 1] },
    { h: 3, c: [1, 1.2, 0.9, 1.1] },
    { h: 4, c: ['s1', 1.3, 1, 's0.9'] },
    { h: 3, c: [1, 0.8, 1.2, 1, 1.1] },
    { h: 4, c: [1.2, 's1', 1.4, 1, 1.1] },
  ];
  const TIER_ROWS = TIERS.reduce((t, k) => t + k.h, 0);
  const TREE_ROWS = 5 + 1 + 1 + TIER_ROWS + 3 + 3;   // yıldız, boşluk, kar şapkası, katlar, gövde, zemin
  const NUMBERS = [17, 4, 26, 11, 29, 2, 21, 8, 14, 30, 6, 19, 1, 24, 12, 27, 9, 16, 3, 22, 13, 28, 7, 18, 25, 5, 20, 10, 15, 23];
  const BULBS = ['apple', 'light', 'sky', 'lilac', 'pink', 'yellow'];

  let W = 0, H = 0, chW = 0, lh = 0, stack = false;
  let bricks = [], tiers = [], hover = -1, cells = null, shown = reduce ? 1e9 : 0;
  const state = new Map(); // kutu no → { open, rows }

  // *-*-*-*-*-*-*-*-*-*-*-* ölçü *-*-*-*-*-*-*-*-*-*-*-*
  // Geniş ekranda başlık solda, ağaç ortada; dar ekranda başlık üstte, ağaç altında.
  const bar = document.querySelector('.bar');
  const measure = () => {
    stack = innerWidth < 1040;
    body.classList.toggle('stack', stack);
    const room = innerHeight - bar.offsetHeight;
    let fs = stack ? Math.floor(innerWidth / (52 * 0.602)) : Math.floor(room / (44 * 1.15));
    fs = Math.max(11, Math.min(18, fs));
    lh = Math.round(fs * 1.15);
    // yıldız girlandın altında kalsın: geniş ekranda en az 45 satır
    while (!stack && fs > 11 && Math.floor(room / lh) < 45) { fs--; lh = Math.round(fs * 1.15); }
    hero.style.setProperty('--fs', fs + 'px');
    hero.style.setProperty('--lh', lh + 'px');
    const probe = document.createElement('span');
    probe.textContent = 'x'.repeat(100);
    probe.style.cssText = 'position:absolute;visibility:hidden;white-space:pre';
    scene.appendChild(probe);
    chW = probe.getBoundingClientRect().width / 100;
    probe.remove();
    W = Math.floor(innerWidth / chW);
    if (stack) {
      words.style.top = (6 * lh) + 'px';
      const textRows = Math.ceil((words.offsetTop + words.offsetHeight) / lh) + 1;
      H = Math.max(Math.floor(room / lh), textRows + TREE_ROWS);
    } else {
      H = Math.floor(room / lh);
      words.style.top = (7 * lh) + 'px';
    }
    hero.style.height = (H * lh) + 'px';
  };

  // Tuğla yerleşimi: katların genişliği tepeden tabana doğrusal büyür, hepsi ortalı.
  const layout = () => {
    const even = (n) => n - (n % 2);
    const baseW = even(Math.min(W - 6, 62));
    const topW = Math.max(8, even(Math.round(baseW * 0.2)));
    const cx = Math.floor(W / 2);
    const tY1 = H - 4, tY0 = tY1 - 3;                 // gövde, zeminin hemen üstünde
    let y = tY0 - TIER_ROWS;
    bricks = []; tiers = [];
    TIERS.forEach((tier, ti) => {
      const w = even(Math.round(topW + ((baseW - topW) * ti) / (TIERS.length - 1)));
      const x0 = cx - w / 2, x1 = cx + w / 2, y0 = y, y1 = y + tier.h;
      tiers.push({ x0, x1, y0, y1 });
      const weights = tier.c.map((v) => (typeof v === 'string' ? parseFloat(v.slice(1)) : v));
      const sum = weights.reduce((a, b) => a + b, 0);
      let acc = 0, prev = x0;
      tier.c.forEach((v, i) => {
        acc += weights[i];
        const right = i === tier.c.length - 1 ? x1 : x0 + Math.round((w * acc) / sum);
        const color = ti < 2 ? 'leaf3' : ti < 4 ? 'leaf' : 'leaf2';
        if (typeof v === 'string') {
          const ym = y0 + Math.floor(tier.h / 2);
          bricks.push({ x0: prev, x1: right, y0, y1: ym, color });
          bricks.push({ x0: prev, x1: right, y0: ym, y1, color });
        } else {
          bricks.push({ x0: prev, x1: right, y0, y1, color });
        }
        prev = right;
      });
      y = y1;
    });
    const gW = Math.max(8, even(Math.round(baseW * 0.2)));
    bricks.push({ x0: cx - gW / 2, x1: cx, y0: tY0, y1: tY1, color: 'bark' });
    bricks.push({ x0: cx, x1: cx + gW / 2, y0: tY0, y1: tY1, color: 'bark' });
    const accents = ['pink', 'yellow', 'lilac'];
    bricks.forEach((b, i) => {
      b.no = NUMBERS[i];
      b.accent = b.color !== 'bark' && i % 3 === 1 ? accents[Math.floor(i / 3) % 3] : null;
      if (!state.has(b.no)) state.set(b.no, { open: false, rows: 0 });
    });
    buttons();
  };

  // *-*-*-*-*-*-*-*-*-*-*-* çizim *-*-*-*-*-*-*-*-*-*-*-*
  let C, T;
  const put = (x, y, c, tag) => { if (x >= 0 && x < W && y >= 0 && y < H) { C[y][x] = c; T[y][x] = tag; } };
  const cls = (k) => `<span class="${k}">`;
  let bulbCount = 0;
  const bulb = (x, y) => {
    bulbCount++;
    const d = (2.2 + ((bulbCount * 37) % 19) / 10).toFixed(1), g = (((bulbCount * 53) % 29) / 10).toFixed(1);
    put(x, y, 'o', `<span class="bulb ${BULBS[bulbCount % BULBS.length]}" style="--d:${d}s;--g:-${g}s">`);
  };

  const draw = () => {
    C = Array.from({ length: H }, () => Array(W).fill(' '));
    T = Array.from({ length: H }, () => Array(W).fill(''));
    bulbCount = 0;

    // yazının ve menünün altı boş kalır
    const clear = [];
    const hr = hero.getBoundingClientRect();
    const box = (el, padX) => {
      const r = el.getBoundingClientRect();
      if (!r.width) return;
      clear.push([Math.floor((r.left - hr.left) / chW) - padX, Math.floor((r.top - hr.top) / lh) - 1,
                  Math.ceil((r.right - hr.left) / chW) + padX, Math.ceil((r.bottom - hr.top) / lh) + 1]);
    };
    words.querySelectorAll('h1, p span').forEach((el) => box(el, 3));
    document.querySelectorAll('header.site .prompt, header.site a, header.site button').forEach((el) => box(el, 1));
    const blocked = (x, y) => clear.some(([a, b, c, d]) => x >= a && x < c && y >= b && y < d);

    // zemin: üç satır karlı tepe
    const z0 = "    _.--._          _.-'''-._      ", z1 = "_.-'      '-.__.--''         ''--._", z2 = " .  '  .   .   '  .  .   '  .   . ";
    for (let x = 0; x < W; x++) {
      put(x, H - 3, z0[x % z0.length], cls('star2'));
      put(x, H - 2, z1[x % z1.length], cls('star2'));
      put(x, H - 1, z2[x % z2.length], cls('star'));
    }

    // girland: menünün altında kavisli tel, telden bir satır aşağıda sarkan ampuller
    const gy = 3;
    const g0 = "'-._        _.-'", g1 = "    '-.__.-'    ";
    const wireRow = (x) => (g0[x % 16] !== ' ' ? gy : gy + 1);
    for (let x = 0; x < W; x++) {
      if (g0[x % 16] !== ' ') put(x, gy, g0[x % 16], cls('star'));
      if (g1[x % 16] !== ' ') put(x, gy + 1, g1[x % 16], cls('star'));
      if (x % 4 === 2) bulb(x, wireRow(x) + 1);
    }

    // ağacın iki yanında telden sarkan farklı boylarda ışık dizileri; yazıya gelince biter
    const last = tiers[tiers.length - 1];
    for (let x = 2; x < W - 2; x += 7) {
      if (x > last.x0 - 5 && x < last.x1 + 5) continue;
      const top = wireRow(x) + 2, len = 5 + Math.floor(hash(x, 7) * Math.min(14, H - 12));
      let end = top;
      while (end < top + len && end < H - 5 && !blocked(x, end) && !blocked(x, end + 1)) end++;
      if (end - top < 2) continue;
      for (let y = top; y < end; y++) {
        if ((y - top) % 3 === 2 || y === end - 1) bulb(x, y); else put(x, y, ':', cls('star'));
      }
    }

    // tuğla duvarları: ortak duvar tek çizilir, köşe ve kesişim karakteri komşulara göre seçilir
    const flag = Array.from({ length: H }, () => Array(W).fill(0)); // 1 yukarı, 2 aşağı, 4 sol, 8 sağ
    const colorAt = Array.from({ length: H }, () => Array(W).fill(null));
    const mark = (x, y, b, col) => { if (x >= 0 && x < W && y >= 0 && y < H) { flag[y][x] |= b; colorAt[y][x] = col; } };
    const ordered = [...bricks].sort((a, b) => (a.color === 'bark') - (b.color === 'bark')).reverse();
    for (const t of ordered) {
      for (let x = t.x0; x <= t.x1; x++) {
        const b = (x > t.x0 ? 4 : 0) | (x < t.x1 ? 8 : 0);
        mark(x, t.y0, b, t.color); mark(x, t.y1, b, t.color);
      }
      for (let y = t.y0; y <= t.y1; y++) {
        const b = (y > t.y0 ? 1 : 0) | (y < t.y1 ? 2 : 0);
        mark(t.x0, y, b, t.color); mark(t.x1, y, b, t.color);
      }
    }
    const sel = bricks[hover];
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const b = flag[y][x];
      if (!b) continue;
      const horiz = b & 12, vert = b & 3, arms = [1, 2, 4, 8].filter((k) => b & k).length;
      let c = '+';
      if (!vert) c = '-';
      else if (!horiz) c = '|';
      else if (arms === 2) c = b & 2 ? '.' : "'";
      const edge = sel && x >= sel.x0 && x <= sel.x1 && y >= sel.y0 && y <= sel.y1 && (x === sel.x0 || x === sel.x1 || y === sel.y0 || y === sel.y1);
      put(x, y, c, edge ? cls('ink hot') : cls(colorAt[y][x]));
    }

    // tuğla içleri: numara ortada; süslü tuğlalarda seyrek nokta; açılınca satır satır parıltı
    for (const t of bricks) {
      const st = state.get(t.no);
      const ih = t.y1 - t.y0 - 1, iw = t.x1 - t.x0 - 1;
      const ny = t.y0 + Math.floor((t.y1 - t.y0) / 2);
      const ns = String(t.no), nx = t.x0 + 1 + Math.floor((iw - ns.length) / 2);
      for (let r = 0; r < ih; r++) {
        const y = t.y0 + 1 + r, opened = r < st.rows;
        for (let x = t.x0 + 1; x < t.x1; x++) {
          if (y === ny && x >= nx - 1 && x <= nx + ns.length) continue;
          if (opened) {
            const h = hash(x, y);
            if (h < 0.4) put(x, y, h < 0.1 ? '*' : h < 0.2 ? '+' : h < 0.31 ? '.' : "'", cls(`spark hot s${(x + y) % 3}`));
          } else if (t.accent && (x + y * 2) % 4 === 0) put(x, y, '·', cls(t.accent));
        }
        if (y === ny) for (let i = 0; i < ns.length; i++) put(nx + i, y, ns[i], opened ? cls('no lit hot') : cls(`no ${t.accent || 'ink'}`));
      }
    }

    // omuzlarda kar, dal uçlarında ampul
    tiers.forEach((k, i) => {
      const up = i > 0 ? tiers[i - 1] : null;
      const cap = (a, b) => { for (let x = a; x <= b; x++) put(x, k.y0 - 1, '.:'[x % 2], cls('star2')); };
      if (up) { cap(k.x0, up.x0 - 1); cap(up.x1 + 1, k.x1); } else cap(k.x0, k.x1);
      bulb(k.x0 - 1, k.y0 + 1); bulb(k.x1 + 1, k.y0 + 1);
    });

    // yıldız: ışınları yanıp söner
    const top = tiers[0], sx = Math.floor((top.x0 + top.x1) / 2), sy = top.y0 - 7;
    const star = [" .  |  . ", "  '.|.'  ", "--==*==--", "  .'|'.  ", " '  |  ' "];
    star.forEach((s, r) => {
      for (let i = 0; i < s.length; i++) {
        if (s[i] === ' ') continue;
        const core = r === 2 && i === 4;
        put(sx - 4 + i, sy + r, s[i], core ? cls('light core') : cls(`light ray r${(i + r) % 2}`));
      }
    });

    // html: aynı etiketli komşu hücreler tek span olur; henüz basılmamış satırlar boş
    let html = '';
    for (let y = 0; y < H; y++) {
      if (y >= shown) { html += '\n'; continue; }
      let open = '';
      for (let x = 0; x < W; x++) {
        const e = T[y][x];
        if (e !== open) { if (open) html += '</span>'; if (e) html += e; open = e; }
        const c = C[y][x];
        html += c === '<' ? '&lt;' : c === '>' ? '&gt;' : c === '&' ? '&amp;' : c;
      }
      if (open) html += '</span>';
      html += '\n';
    }
    scene.innerHTML = html;
    words.classList.toggle('shown', shown * lh > words.offsetTop);
    cells = C.map((row, y) => row.map((c, x) => c !== ' ' || blocked(x, y)));
    for (const k of [...tiers, ...bricks]) for (let y = k.y0; y <= k.y1; y++) for (let x = k.x0; x <= k.x1; x++) if (cells[y]) cells[y][x] = true;
  };

  // *-*-*-*-*-*-*-*-*-*-*-* kutular *-*-*-*-*-*-*-*-*-*-*-*
  // Her tuğlanın üstünde görünmez bir düğme: üstüne gelince kenarı parlar, tıklayınca açılır.
  const buttons = () => {
    hero.querySelectorAll('.box').forEach((b) => b.remove());
    bricks.forEach((t, i) => {
      const b = document.createElement('button');
      b.className = 'box';
      b.style.cssText = `left:${t.x0 * chW}px;top:${t.y0 * lh}px;width:${(t.x1 - t.x0 + 1) * chW}px;height:${(t.y1 - t.y0 + 1) * lh}px`;
      b.setAttribute('aria-label', `box ${t.no}`);
      b.setAttribute('aria-pressed', String(state.get(t.no).open));
      b.addEventListener('pointerenter', () => { hover = i; draw(); });
      b.addEventListener('pointerleave', () => { if (hover === i) { hover = -1; draw(); } });
      b.addEventListener('focus', () => { hover = i; draw(); });
      b.addEventListener('blur', () => { if (hover === i) { hover = -1; draw(); } });
      b.addEventListener('click', () => toggle(t, b));
      hero.appendChild(b);
    });
  };

  const status = document.getElementById('status');
  const count = () => {
    const n = [...state.values()].filter((d) => d.open).length;
    status.textContent = n ? ` ${bricks.length} boxes, ${n} opened ` : ' tap a box to open it ';
  };

  const toggle = (t, b) => {
    const st = state.get(t.no);
    st.open = !st.open;
    b.setAttribute('aria-pressed', String(st.open));
    count();
    const goal = st.open ? t.y1 - t.y0 - 1 : 0;
    if (reduce) { st.rows = goal; draw(); return; }
    const step = () => {
      if (st.rows === goal) return;
      st.rows += st.rows < goal ? 1 : -1;
      draw();
      setTimeout(step, 70);
    };
    step();
  };

  // *-*-*-*-*-*-*-*-*-*-*-* kar *-*-*-*-*-*-*-*-*-*-*-*
  // Izgarada hücre hücre düşer; çizimin ve yazının olduğu hücrelere girmez.
  let flakes = [], timer = 0, paused = reduce;
  const marks = ['*', '-', '*', '.', '+', '-', '*', "'"];
  const flake = (fromTop) => ({ x: Math.floor(Math.random() * W), y: fromTop ? 0 : Math.floor(Math.random() * (H - 4)), speed: 2 + Math.floor(Math.random() * 4), t: 0, c: marks[Math.floor(Math.random() * marks.length)] });
  const seed = () => { flakes = Array.from({ length: Math.round((W * H) / 55) }, () => flake(false)); };
  const snowDraw = () => {
    const rows = Array.from({ length: H }, () => Array(W).fill(' '));
    for (const f of flakes) if (f.y < Math.min(H, shown) && !(cells[f.y] && cells[f.y][f.x])) rows[f.y][f.x] = f.c;
    snowPre.textContent = rows.map((r) => r.join('')).join('\n');
  };
  const fall = () => {
    for (const f of flakes) {
      if (++f.t < f.speed) continue;
      f.t = 0; f.y++;
      if (Math.random() < 0.18) f.x = (f.x + (Math.random() < 0.5 ? -1 : 1) + W) % W;
      if (f.y >= H - 3) Object.assign(f, flake(true));
    }
    snowDraw();
  };
  const run = () => { clearInterval(timer); if (!paused && !document.hidden) timer = setInterval(fall, 110); };

  const motion = document.getElementById('motion');
  const setPaused = (p) => {
    paused = p;
    body.classList.toggle('paused', p);
    motion.textContent = p ? 'play' : 'pause';
    motion.setAttribute('aria-pressed', String(p));
    run();
  };
  motion.addEventListener('click', () => setPaused(!paused));
  document.addEventListener('visibilitychange', run);

  // tmux gibi saat: 02:14 01-nov-26
  const clock = document.getElementById('clock');
  const tick = () => {
    const d = new Date(), p = (n) => String(n).padStart(2, '0');
    const mon = d.toLocaleString('en', { month: 'short' }).toLowerCase();
    clock.textContent = `${p(d.getHours())}:${p(d.getMinutes())} ${p(d.getDate())}-${mon}-${String(d.getFullYear()).slice(2)} `;
  };
  tick(); setInterval(tick, 20000);

  // komut yazılır, sonra ağaç satır satır basılır
  const cmd = document.getElementById('cmd');
  const print = () => {
    if (shown >= H) { shown = 1e9; draw(); snowDraw(); return; }
    shown += 1; draw(); setTimeout(print, 16);
  };
  const type = () => {
    if (reduce) { cmd.textContent = 'tree'; return; }
    let i = 0;
    const letter = () => { cmd.textContent = 'tree'.slice(0, ++i); if (i < 4) setTimeout(letter, 110); else setTimeout(print, 260); };
    setTimeout(letter, 350);
  };

  const all = () => { measure(); layout(); draw(); seed(); snowDraw(); };
  all();
  setPaused(paused);
  let started = false;
  document.fonts.ready.then(() => { all(); if (!started) { started = true; type(); } });
  let wait;
  addEventListener('resize', () => { clearTimeout(wait); wait = setTimeout(all, 120); });
})();
</script>
</body>
</html>
